name: Deploy PulseDeck suite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "CapacityLens/app/**"
      - "ScorePulse/**"
      - "PulseDeck/**"
      - "scripts/build-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            CapacityLens/app/package-lock.json
            CapacityLens/app/client/package-lock.json
            CapacityLens/app/server/package-lock.json
            ScorePulse/client/package-lock.json
            PulseDeck/package-lock.json

      - name: Install suite dependencies
        run: |
          npm install
          npm run install:suite

      - name: Build static suite for GitHub Pages
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
